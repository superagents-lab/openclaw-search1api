name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release version tag (must match package version)
        required: true
        default: v0.2.0
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: clawhub
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.release_ref || github.event.release.tag_name }}
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) throw new Error('Release tag and package version differ')"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run plugin:validate
      - run: npx --yes clawhub@0.23.3 package publish . --family code-plugin --no-input
